<script type="text/javascript">
//<![CDATA[
function autoGrowAndCount(element) {
    var maxChars = 2000; // Your maximum character limit

    // 1. Manually enforce the Maxlength cap for the Strict Validator
    if (element.value.length > maxChars) {
        element.value = element.value.substring(0, maxChars);
    }

    // Update the countdown display
    var charsRemaining = maxChars - element.value.length;
    document.getElementById("char-count-left").innerHTML = charsRemaining.toString();

    // 2. Auto-grow height logic
    element.style.height = "50px";
    var currentScrollHeight = element.scrollHeight;
    
    if (currentScrollHeight < 300) {
        element.style.height = currentScrollHeight + "px";
        element.style.overflowY = "hidden";
    } else {
        element.style.height = "300px";
        element.style.overflowY = "auto";
    }
}

//<![CDATA[
function validateRequiredFields() {
    var name = document.getElementById("form_name").value.replace(/^\s+|\s+$/g, "");
    var email = document.getElementById("form_email").value.replace(/^\s+|\s+$/g, "");
    var message = document.getElementById("message").value.replace(/^\s+|\s+$/g, "");

    if (name === "" || email === "" || message === "") {
        alert("Please fill out all fields before submitting.");
        return false; // Blocks the form from sending to web3forms
    }
    return true; // Form is full, allows the form to process
}
//]]>
